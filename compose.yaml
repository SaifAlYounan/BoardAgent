name: boardagent

services:
  maintenance-lock-init:
    image: ${RELEASE_IMAGE:-boardagent:local}
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        set -eu
        umask 077
        [ -d /coord ] && [ ! -L /coord ]
        install -d -o 0 -g 10001 -m 0750 /coord
        for entry in /coord/* /coord/.[!.]* /coord/..?*; do
          [ -e "$$entry" ] || [ -L "$$entry" ] || continue
          [ "$$entry" = /coord/maintenance.lock ]
          [ -f "$$entry" ] && [ ! -L "$$entry" ]
          [ "$$(stat -c %u "$$entry")" = 0 ]
          [ "$$(stat -c %g "$$entry")" = 10001 ]
          [ "$$(stat -c %a "$$entry")" = 440 ]
          [ "$$(stat -c %h "$$entry")" = 1 ]
          [ "$$(stat -c %s "$$entry")" = 0 ]
        done
        if [ ! -e /coord/maintenance.lock ]; then
          (set -C; : > /coord/maintenance.lock)
          chown 0:10001 /coord/maintenance.lock
          chmod 0440 /coord/maintenance.lock
          sync
        fi
    volumes:
      - maintenance-coordination:/coord
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    restart: "no"
    network_mode: none

  postgres:
    build:
      context: .
      target: postgres-runtime
    image: ${POSTGRES_IMAGE:-boardagent-postgres:local}
    environment:
      POSTGRES_DB: boardagent
      POSTGRES_USER: boardagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardagent-local-only}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0775,uid=70,gid=70
    read_only: true
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U boardagent -d boardagent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  server:
    build:
      context: .
      target: runtime
    image: ${RELEASE_IMAGE:-boardagent:local}
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    depends_on:
      maintenance-lock-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - maintenance-coordination:/run/boardagent-maintenance:ro
      - boardagent-blobs:/var/lib/boardagent/blobs
      - boardagent-exports:/var/lib/boardagent/exports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PUBLISHED_PORT:-8787}:8787"
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [backend, edge]

  worker:
    image: ${RELEASE_IMAGE:-boardagent:local}
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    command: ["node", "artifacts/server/dist/main.js", "worker"]
    healthcheck:
      test: ["CMD", "node", "artifacts/server/dist/main.js", "healthcheck", "worker"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      maintenance-lock-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - maintenance-coordination:/run/boardagent-maintenance:ro
      - boardagent-blobs:/var/lib/boardagent/blobs
      - boardagent-exports:/var/lib/boardagent/exports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [backend]

  caddy-volume-init:
    image: ${CADDY_IMAGE:-boardagent-caddy:local}
    profiles: ["https"]
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command: ["chown -R 10002:10002 /data /config && chmod 0700 /data /config"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks: [edge]

  caddy:
    build:
      context: .
      target: caddy-runtime
    image: ${CADDY_IMAGE:-boardagent-caddy:local}
    profiles: ["https"]
    environment:
      BOARDAGENT_DOMAIN: ${CADDY_DOMAIN:-boardagent.invalid}
    depends_on:
      server:
        condition: service_started
      caddy-volume-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    user: "10002:10002"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [edge]

volumes:
  maintenance-coordination:
  postgres-data:
  boardagent-blobs:
  boardagent-exports:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge:
